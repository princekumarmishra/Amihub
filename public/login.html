<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Amihub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body class="auth-container">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="auth-card">
                    <div class="auth-header" id="authHeader">
                        <img src="logo.png" alt="Amihub Logo" class="auth-logo mb-3" height="60" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';">
                        <i class="fas fa-lightbulb fa-4x mb-3" style="display: none; color: #007bff;"></i>
                        <h3 id="authTitle">Welcome Back</h3>
                        <p id="authSubtitle">Login to your Amihub account</p>
                    </div>
                    <div class="auth-body">
                        <!-- Role Selection Tabs -->
                        <div class="mb-4">
                            <ul class="nav nav-pills nav-fill" id="roleTabs" role="tablist">
                                <li class="nav-item" role="presentation">
                                    <button class="nav-link active" id="student-tab" data-bs-toggle="pill" data-bs-target="#student-login" type="button" role="tab">
                                        <i class="fas fa-graduation-cap me-2"></i>Student
                                    </button>
                                </li>
                                <li class="nav-item" role="presentation">
                                    <button class="nav-link" id="mentor-tab" data-bs-toggle="pill" data-bs-target="#mentor-login" type="button" role="tab">
                                        <i class="fas fa-chalkboard-teacher me-2"></i>Mentor
                                    </button>
                                </li>
                            </ul>
                        </div>

                        <!-- Tab Content -->
                        <div class="tab-content" id="roleTabContent">
                            <!-- Student Login -->
                            <div class="tab-pane fade show active" id="student-login" role="tabpanel">
                                <form id="studentLoginForm">
                                    <input type="hidden" name="role" value="student">
                                    <div class="mb-3">
                                        <label for="studentEmail" class="form-label">Student Email</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                                            <input type="email" class="form-control" id="studentEmail" name="email" required>
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label for="studentPassword" class="form-label">Password</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                            <input type="password" class="form-control" id="studentPassword" name="password" required>
                                        </div>
                                    </div>
                                    <div class="mb-3 form-check">
                                        <input type="checkbox" class="form-check-input" id="studentRememberMe">
                                        <label class="form-check-label" for="studentRememberMe">Remember me</label>
                                    </div>
                                    <button type="submit" class="btn btn-primary w-100 mb-3">Student Login</button>
                                </form>
                            </div>

                            <!-- Mentor Login -->
                            <div class="tab-pane fade" id="mentor-login" role="tabpanel">
                                <form id="mentorLoginForm">
                                    <input type="hidden" name="role" value="mentor">
                                    <div class="mb-3">
                                        <label for="mentorEmail" class="form-label">Mentor Email</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                                            <input type="email" class="form-control" id="mentorEmail" name="email" required>
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label for="mentorPassword" class="form-label">Password</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                            <input type="password" class="form-control" id="mentorPassword" name="password" required>
                                        </div>
                                    </div>
                                    <div class="mb-3 form-check">
                                        <input type="checkbox" class="form-check-input" id="mentorRememberMe">
                                        <label class="form-check-label" for="mentorRememberMe">Remember me</label>
                                    </div>
                                    <button type="submit" class="btn btn-success w-100 mb-3">Mentor Login</button>
                                </form>
                            </div>
                        </div>
                        <div class="text-center mt-4">
                            <p>Don't have an account? <a href="register.html">Register here</a></p>
                            <a href="#" class="text-muted">Forgot Password?</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="auth.js"></script>
</body>
</html>
